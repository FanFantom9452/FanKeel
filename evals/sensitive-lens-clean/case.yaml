schema_version: "1.1"
name: sensitive-lens-clean
context:
  scaffold_script: "git init -q && mkdir -p .fankeel && printf 'sessions/\\nsensitive.txt\\n' > .fankeel/.gitignore && printf 'ACME\\n' > .fankeel/sensitive.txt && printf 'module.exports = {};\\n' > config.js && git add -A && git -c user.email=eval@fankeel -c user.name=eval commit -qm base && printf 'const retries = 3;\\nmodule.exports = { retries };\\n' > config.js && git add -A && git -c user.email=eval@fankeel -c user.name=eval commit -qm 'retry three times'"
